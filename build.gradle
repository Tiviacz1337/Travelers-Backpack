plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${mod_loader}-${minecraft_version}-${mod_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("src/generated/**/.cache")
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    validateAccessTransformers = true
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    parchment {
        mappingsVersion = "2024.11.17"
        minecraftVersion = "1.21.1"
    }

    runs {
        client {
            client()
        }
        client2 {
            client()
            programArguments = ["--username Dev2"]
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    maven { url "https://cursemaven.com" }
    maven { url 'https://api.modrinth.com/maven' }

    //LambDynamicLights
    maven { url "https://maven.gegy.dev" }
}

def mappingsAttribute = Attribute.of("net.minecraft.mappings", String.class)

dependencies {
    implementation("net.neoforged:neoforge:${neo_version}")

    //Curios
    implementation("maven.modrinth:curios:yohfFbgD")

    //LambDynamicLights
    attributesSchema {
        attribute(mappingsAttribute)
    }

    compileOnly("dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:4.8.8+1.21.1") {
        attributes {
            attribute(mappingsAttribute, "mojmap")
        }
    }
    //localRuntime("dev.lambdaurora.lambdynamiclights:lambdynamiclights-runtime:4.10.2+26.1.2")

    //JEI
    implementation("maven.modrinth:jei:KbENlUcA")

    //EMI
    compileOnly("maven.modrinth:emi:ouSj7NfF")

    //REI
    compileOnly("maven.modrinth:rei:b8gfS9Je")
    compileOnly("maven.modrinth:architectury-api:ZxYGwlk0")
    compileOnly("maven.modrinth:cloth-config:izKINKFg")

    //Crafting Tweaks
    implementation("maven.modrinth:crafting-tweaks:StwKB1IQ")
