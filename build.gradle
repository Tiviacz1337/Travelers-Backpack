plugins {
	id 'fabric-loom' version '1.7-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-${project.mod_loader}-${project.minecraft_version}"
}

repositories {

	maven {
		url "https://cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}

	maven {
		// location of the maven that hosts JEI files
		name = "Progwml6 maven"
		url = "https://dvs1.progwml6.com/files/maven/"
	}
	maven {
		// location of a maven mirror for JEI files, as a fallback
		name = "ModMaven"
		url = "https://modmaven.k-4u.nl"
	}

	maven {
		url "https://maven.siphalor.de/"
	}

	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name = 'Ladysnake Mods'
		url = 'https://maven.ladysnake.org/releases'
	}

	//maven { url = "https://jitpack.io" }
	maven { url "https://maven.shedaniel.me/" }

	maven {
		url "https://maven.jamieswhiteshirt.com/libs-release"
		content {
			includeGroup "com.jamieswhiteshirt"
		}
	}

	maven { url 'https://maven.nucleoid.xyz' }
	maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
	maven { url 'https://api.modrinth.com/maven' }

	maven {
		name 'Gegy'
		url 'https://maven.gegy.dev'
	}

	maven { url "https://api.modrinth.com/maven" }
	maven { url "https://server.bbkr.space/artifactory/libs-release" }  // LibGUI
	maven { url "https://mvn.devos.one/releases/" } // Porting Lib

	maven {
		name = 'ParchmentMC'
		url = 'https://maven.parchmentmc.org'
	}

	/*maven { url = "https://www.cursemaven.com" }
	maven { url = "https://maven.shedaniel.me/" }
	maven { url = "https://maven.terraformersmc.com/" }
	maven { url = "https://maven.wispforest.io/" }
	maven { url = "https://jitpack.io" }
	maven { url = "https://maven.ladysnake.org/releases" }
	maven { url = "https://maven.cafeteria.dev" }
	maven { url = "https://maven.jamieswhiteshirt.com/libs-release" }
	maven { url = "https://api.modrinth.com/maven/" }
	maven { url = "https://maven.nucleoid.xyz/" } */


	repositories {
		maven {
			url "https://maven.twelveiterations.com/repository/maven-public/"

			content {
				includeGroup "net.blay09.mods"
			}
		}
	}
}

fabricApi {
	configureDataGeneration()
}

loom {
	accessWidenerPath = file("src/main/resources/travelersbackpack.accesswidener")
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.layered() {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-1.20.1:2023.09.03@zip")
	}
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	//REQUIRED

	//Cardinal Components
	modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cca_version}"
	modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cca_version}"

	//Cloth Config
	modRuntimeOnly("dev.architectury:architectury-fabric:${project.architectury_version}")
	modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

	//Reach Entity Attributes
	include modImplementation("com.jamieswhiteshirt:reach-entity-attributes:${project.reach_entity_attributes_version}")

	//OPTIONAL

	//Crafting Tweaks
	//modImplementation "curse.maven:balm-fabric-500525:5644969"
	//modImplementation "curse.maven:crafting-tweaks-fabric-502516:5623638"
	//modApi("net.blay09.mods:kuma-api-fabric:[20.1.0,20.2.0)")

	//ModMenu
	modImplementation "com.terraformersmc:modmenu:${project.mod_menu_version}"

	//Majrusz
	//modRuntimeOnly("curse.maven:mpd-430642:5293468")
	//modRuntimeOnly("curse.maven:ml-437409:5301915")

	//Deselect
	modImplementation("maven.modrinth:deselect:Ter2PgA6")

    //OPAC
    modRuntimeOnly("maven.modrinth:forge-config-api-port:1aKtMQZE")
    modRuntimeOnly("maven.modrinth:open-parties-and-claims:T2Gpqmeu") //T2Gpqmeu")

	//Stack Size Edit
	//modImplementation("maven.modrinth:stack-size-edit:Fml5ea8S")

	//Trinkets
	modCompileOnly("dev.emi:trinkets:${trinkets_version}")

	//Accessories
	//modCompileOnly("maven.modrinth:accessories:TK44XAd7")
	//modCompileOnly("maven.modrinth:accessories-tc-layer:byhR4pVP")

	//REI
	modCompileOnly("me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}")

	//JEI
    modCompileOnly("maven.modrinth:jei:KcsHvRrB")

	//Comforts
	modCompileOnly ("maven.modrinth:comforts:pMr60Kkq")

	//EMI
    modImplementation "dev.emi:emi-fabric:${project.emi_version}"

	//Dehydration
	modCompileOnly "curse.maven:dehydration-410830:5204866"

	//Universal Graves
	modCompileOnly "curse.maven:universal-graves-497175:5706124"

	//Polymorph
	modCompileOnly("maven.modrinth:polymorph:z88tNWJh")

	//TAN
	modCompileOnly("curse.maven:tan-246391:5815864")

	//Carry On
	modCompileOnly "curse.maven:carryon-274259:4882498"

	//Yigd
	modCompileOnly("maven.modrinth:yigd:C2PIq5XX")
	modCompileOnly("io.github.cottonmc:LibGui:8.1.1+1.20.1")
	modCompileOnly("me.lucko:fabric-permissions-api:0.2-SNAPSHOT")

	//Create
	//modRuntimeOnly "maven.modrinth:create-fabric:h2HgGyvA"
	//modRuntimeOnly "maven.modrinth:fxnt-create-storage:H3voyod7"
	//modRuntimeOnly "maven.modrinth:porting_lib:GWCykcY1"
	//modRuntimeOnly "io.github.fabricators_of_create.Porting-Lib:$module:2.3.5-beta.31+1.20.1"
	//modRuntimeOnly "maven.modrinth:forge-config-api-port:CtENDTlF"

	//modRuntimeOnly("eu.pb4:sgui:1.2.2+1.20")
	//modRuntimeOnly("eu.pb4:placeholder-api:2.1.1+1.20")
	//modRuntimeOnly('xyz.nucleoid:server-translations-api:2.0.0+1.20')
	//modRuntimeOnly('eu.pb4:polymer-core:0.5.3+1.20.1')
	//modRuntimeOnly('eu.pb4:polymer-resource-pack:0.5.3+1.20.1')
	//modRuntimeOnly('eu.pb4:polymer-virtual-entity:0.5.3+1.20.1')
	//modRuntimeOnly('eu.pb4:predicate-api:0.1.2+1.20')
	//modRuntimeOnly("eu.pb4:common-protection-api:1.0.0")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
