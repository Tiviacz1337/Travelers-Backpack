plugins {
	id 'fabric-loom' version '1.15-SNAPSHOT'
}

version = "${mod_loader}-${minecraft_version}-${mod_version}"
group = mod_group_id

base {
	archivesName = mod_id
}

repositories {
	maven { url "https://cursemaven.com" }
	maven { url = "https://maven.ladysnake.org/releases" }
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.jamieswhiteshirt.com/libs-release" }
	maven { url "https://api.modrinth.com/maven" }
	maven { url = "https://maven.parchmentmc.org" }
	maven { url "https://maven.wispforest.io/releases" }
	maven { url "https://maven.twelveiterations.com/repository/maven-public/" }

	//LambDynamicLights
	maven { url "https://maven.gegy.dev" }
}

fabricApi {
	configureDataGeneration()
}

loom {
	accessWidenerPath = file("src/main/resources/travelersbackpack.accesswidener")
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.layered() {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-1.21:2024.11.10@zip")
	}
	modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	//REQUIRED

	//Cardinal Components
	modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cca_version}"
	modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cca_version}"

	//Required for Polymorph
	modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-block:${project.cca_version}"

	//Cloth Config
	//modImplementation("maven.modrinth:cloth-config:HpMb5wGb")
	modImplementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}")

	//OPTIONAL

	//LambDynamicLights
	modCompileOnly("dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:4.8.8+1.21.1")
	modLocalRuntime("dev.lambdaurora.lambdynamiclights:lambdynamiclights-runtime:4.8.8+1.21.1")

	//Crafting Tweaks
	modImplementation("maven.modrinth:balm:jiTpUYmp")
	modImplementation("maven.modrinth:crafting-tweaks:hOCFoQac")
	modApi("net.blay09.mods:kuma-api-fabric:21.0.7+1.21")

	//Trash Slot
	modImplementation("curse.maven:trashslot-235577:6319140")

	//ModMenu
	modImplementation("maven.modrinth:modmenu:v6Xx3fbU")

	//Trinkets
	modCompileOnly("maven.modrinth:trinkets:JagCscwi")

	//Accessories
	modCompileOnly("maven.modrinth:accessories:Xlt4eWBe")

	//REI
	modCompileOnly("maven.modrinth:rei:aWzTESNC")
	modCompileOnly("maven.modrinth:architectury-api:Wto0RchG")

	//JEI
	modImplementation("maven.modrinth:jei:P23di0ns")

	//Item scroller
	modCompileOnly("maven.modrinth:item-scroller:uK5Njuv8")
	modCompileOnly("maven.modrinth:malilib:f8wE52F5")

	//VinURL
	modCompileOnly("maven.modrinth:vinurl:7miV5XPm")

	//Polymorph
	modCompileOnly("maven.modrinth:polymorph:j4jPy88h")

	//Comforts
	modCompileOnly("maven.modrinth:comforts:vUdakIzK")

	//EMI
	modCompileOnly("maven.modrinth:emi:mYQ3bJs5")

	//Universal Graves
	modCompileOnly("curse.maven:universal-graves-497175:5435263")

	//Mouse Tweaks
	modCompileOnly("curse.maven:mouse-tweaks-60089:5437294")

	//TAN
	modCompileOnly("curse.maven:tan-246391:5715303")
	modCompileOnly("curse.maven:glitchcore-955399:5483774")

	//EMF & ETT
	modCompileOnly("maven.modrinth:entity-model-features:9t01xL7K")
	modCompileOnly("maven.modrinth:entitytexturefeatures:zzyLrMkD")

	//TS
	modCompileOnly("maven.modrinth:terrastorage:4lI1uVXX")

    modCompileOnly("maven.modrinth:always-eat:pANmjAAt")

	//Gravestones
	modCompileOnly("maven.modrinth:pneumono_gravestones:HO3Zv8HU")
	modCompileOnly("maven.modrinth:pneumono_core:QKvgjhTZ")

	//ESB
	//modImplementation ("maven.modrinth:easy-shulker-boxes:m5lAjDSt")
	//modImplementation ("maven.modrinth:puzzles-lib:E8hn913v")
	//modImplementation ("maven.modrinth:forge-config-api-port:NqVx7ywO")

	//modImplementation("maven.modrinth:lithium:5szYtenV")

	//modRuntimeOnly("net.fabricmc:fabric-language-kotlin:1.11.0+kotlin.2.0.0")
	//modRuntimeOnly("maven.modrinth:expanded-armor-enchanting:FsoLIMq8")

	//Carry On
	//modRuntimeOnly "curse.maven:carryon-274259:5141763"

	//modRuntimeOnly("eu.pb4:sgui:1.2.2+1.20")
	//modRuntimeOnly("eu.pb4:placeholder-api:2.1.1+1.20")
	//modRuntimeOnly('xyz.nucleoid:server-translations-api:2.0.0+1.20')
	//modRuntimeOnly('eu.pb4:polymer-core:0.5.3+1.20.1')
	//modRuntimeOnly('eu.pb4:polymer-resource-pack:0.5.3+1.20.1')
