plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.21'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${mod_loader}-${minecraft_version}-${mod_version}"
group = mod_group_id

repositories {
    mavenLocal()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    clientData {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url 'https://api.modrinth.com/maven'
    }
}

dependencies {
    implementation("net.neoforged:neoforge:${neo_version}")

    //Curios
    compileOnly("maven.modrinth:curios:68gxflop")

    //JEI
    implementation("maven.modrinth:jei:XkrFsbih")

    //EMI
    //compileOnly("maven.modrinth:emi:ouSj7NfF") //Not Updated

    //REI
    compileOnly("maven.modrinth:rei:rCAaJej0") //Not Updated
    compileOnly("maven.modrinth:architectury-api:EvL9NK2R") //Not Updated
    compileOnly("maven.modrinth:cloth-config:Wsus0EWg") //Not Updated

    //Crafting Tweaks
    implementation("maven.modrinth:crafting-tweaks:Lnhol0EM")
    implementation("maven.modrinth:balm:4q61ySlS")

    //Trash Slot
    compileOnly("maven.modrinth:trashslot:8qYqcrpb")

    //Comforts
    compileOnly("maven.modrinth:comforts:CZFrqdSy") //Not Updated

    //Accessories
    compileOnly("maven.modrinth:accessories:Lp7d65h7") //Not Updated
    compileOnly("maven.modrinth:owo-lib:U1h2fIEv") //Not Updated

    //Mouse Tweaks
    //implementation("curse.maven:mousetweaks-60089:5637846")

    //Polymorph
    //implementation("curse.maven:polymorph-388800:5696658")

    //Tough as Nails
    compileOnly("maven.modrinth:tough-as-nails:6zSGsGJC") //Not Updated
    //runtimeOnly("curse.maven:glitchcore-955399:5645390")

}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_dependency_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_display_name       : mod_display_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_display_url        : mod_display_url,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}